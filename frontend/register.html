<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Apex University Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Top Navigation Bar -->
  <nav class="navbar">
    <div class="logo">Apex University</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
  </nav>

  <!-- Registration Container -->
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
    <div class="card" style="width: 100%; max-width: 480px; padding: 2.5rem;">
      <h2 style="text-align: center; color: var(--primary); margin-bottom: 0.5rem;">Create an Account</h2>
      <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">Register for the Apex University Portal</p>
      
      <form id="register-form">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="john@apex.edu" required>
        </div>

        <div class="form-group">
          <label>Register As</label>
          <select id="reg-role" class="form-control">
            <option value="student">Student</option>
            <option value="faculty">Faculty Member</option>
          </select>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="reg-confirm-password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem;">Register Account</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600;">Sign in here</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const pass = document.getElementById('reg-password').value;
      const confirmPass = document.getElementById('reg-confirm-password').value;

      if (pass !== confirmPass) {
        alert('Passwords do not match. Please check again.');
        return;
      }

      alert('Registration successful! Redirecting to login page.');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
