<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Apex University Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Top Navigation Bar -->
  <nav class="navbar">
    <div class="logo">Apex University</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="login.html" class="active">Login</a></li>
    </ul>
  </nav>

  <!-- Login Container -->
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
    <div class="card" style="width: 100%; max-width: 420px; padding: 2.5rem;">
      <h2 style="text-align: center; color: var(--primary); margin-bottom: 0.5rem;">Portal Sign In</h2>
      <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">Select your role and enter your credentials</p>
      
      <form id="login-form">
        <div class="form-group">
          <label>Portal Role</label>
          <select id="login-role" class="form-control">
            <option value="admin">Administrator</option>
            <option value="student">Student</option>
            <option value="faculty">Faculty Member</option>
          </select>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="username@apex.edu" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.85rem;">
          <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer;">
            <input type="checkbox"> Remember me
          </label>
          <a href="forgot-password.html" style="color: var(--accent);">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Sign In</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600;">Register here</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    // Handle mock login redirection based on role selection
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const role = document.getElementById('login-role').value;
      
      if (role === 'admin') {
        window.location.href = 'admin/admin-dashboard.html';
      } else if (role === 'student') {
        window.location.href = 'student/student-dashboard.html';
      } else {
        alert('Faculty portal login simulated successfully!');
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
