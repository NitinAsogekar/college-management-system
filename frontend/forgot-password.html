<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Apex University Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Top Navigation Bar -->
  <nav class="navbar">
    <div class="logo">Apex University</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="login.html" class="active">Login</a></li>
    </ul>
  </nav>

  <!-- Forgot Password Container -->
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
    <div class="card" style="width: 100%; max-width: 420px; padding: 2.5rem;">
      <h2 style="text-align: center; color: var(--primary); margin-bottom: 0.5rem;">Reset Password</h2>
      <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">Enter your registered email address to receive password reset instructions.</p>
      
      <form id="forgot-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="reset-email" class="form-control" placeholder="username@apex.edu" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem;">Send Reset Link</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Remembered your password? <a href="login.html" style="color: var(--primary); font-weight: 600;">Sign in here</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('reset-email').value;
      alert(`Password reset instructions have been sent to ${email}. Please check your inbox.`);
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
